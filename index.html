<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الغياب اليومي - مدرسة جوفاء للبنين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- رأس الصفحة -->
        <header class="header">
            <div class="logo-section">
                <h1>📚 برنامج الغياب اليومي</h1>
                <p>مدرسة جوفاء للتعليم الأساسي (5-12) بنين</p>
                <p class="school-info">مدير المدرسة: ناصر العمري | التصميم: أ/ وليد علي صبره</p>
            </div>
        </header>

        <!-- اختيار الصف والتاريخ -->
        <div class="controls">
            <div class="control-group">
                <label for="classSelect">اختر الصف:</label>
                <select id="classSelect" onchange="loadStudents()">
                    <option value="">-- اختر صفاً --</option>
                    <option value="5">الصف الخامس</option>
                    <option value="6">الصف السادس</option>
                    <option value="7">الصف السابع</option>
                    <option value="8">الصف الثامن</option>
                    <option value="9">الصف التاسع</option>
                    <option value="10">الصف العاشر</option>
                    <option value="11">الصف الحادي عشر</option>
                    <option value="12">الصف الثاني عشر</option>
                </select>
            </div>

            <div class="control-group">
                <label for="periodSelect">اختر الحصة:</label>
                <select id="periodSelect">
                    <option value="1">الحصة الأولى</option>
                    <option value="2">الحصة الثانية</option>
                    <option value="3">الحصة الثالثة</option>
                    <option value="4">الحصة الرابعة</option>
                    <option value="5">الحصة الخامسة</option>
                    <option value="6">الحصة السادسة</option>
                    <option value="7">الحصة السابعة</option>
                    <option value="8">الحصة الثامنة</option>
                </select>
            </div>

            <div class="control-group">
                <label for="dateInput">التاريخ:</label>
                <input type="date" id="dateInput">
            </div>
        </div>

        <!-- جدول الطلاب -->
        <div class="students-section">
            <div id="noClassSelected" class="message">
                <p>⬅️ الرجاء اختيار صف لعرض قائمة الطلاب</p>
            </div>

            <table id="studentsTable" style="display:none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الطالب</th>
                        <th>
                            <span class="status-btn present" title="حاضر">✅</span>
                        </th>
                        <th>
                            <span class="status-btn absent" title="غائب">❌</span>
                        </th>
                        <th>
                            <span class="status-btn late" title="متأخر">⏰</span>
                        </th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="studentsList"></tbody>
            </table>
        </div>

        <!-- أزرار الحفظ والإحصائيات -->
        <div class="action-buttons">
            <button onclick="saveAttendance()" class="btn btn-save">💾 حفظ الحضور</button>
            <button onclick="clearAll()" class="btn btn-clear">🔄 مسح الكل</button>
            <button onclick="printAttendance()" class="btn btn-print">🖨️ طباعة</button>
            <button onclick="openStatistics()" class="btn btn-stats">📊 الإحصائيات</button>
        </div>
    </div>

    <!-- نافذة الإحصائيات -->
    <div id="statisticsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeStatistics()">&times;</span>
            <h2>📊 الإحصائيات العامة للمدرسة</h2>
            <div id="statisticsContent"></div>
            <button onclick="closeStatistics()" class="btn btn-close">إغلاق</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
